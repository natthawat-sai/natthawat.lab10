<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lab 10 Web Storage (Glass UI)</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <h1>My Web Storage</h1>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="Enter your name">
        </div>
        
        <div class="button-group">
            <button class="btn-primary" onclick="saveName()">Save Name</button>
            <button class="btn-danger" onclick="clearName()">Clear</button>
        </div>
        
        <p id="result"></p>
        
        <div class="divider"></div>
        
        <p id="visitCount" class="badge"></p>

        <button id="installApp" class="btn-install" style="display: none;">
            Install App (PWA)
        </button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
